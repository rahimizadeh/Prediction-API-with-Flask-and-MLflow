services:
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "8080:8080"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: mlflow server --host 0.0.0.0 --port 8080 --backend-store-uri /mlflow/mlruns

  flask-app:
    build: .
    ports:
      - "5001:5001"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:8080
      MODEL_URI: models:/SalaryRandomForest@champion
    depends_on:
      - mlflow-server
